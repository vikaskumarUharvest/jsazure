name: Build and Push to ACR

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: jscontainer.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jscontainer.azurecr.io/js-azure:${{ github.sha }}   # ← was :latest

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service                                  # ← new step
        uses: azure/webapps-deploy@v2
        with:
          app-name: js-express-app
          images: jscontainer.azurecr.io/js-azure:${{ github.sha }}
